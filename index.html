<!-- מראת localStorage: מציבה פלטה וכתב לפני ה-CSS, אחרת כל טעינה
     נפתחת בהבזק של פלטת ברירת המחדל. SPEC §3.5 -->
<script>window._BUNDLE_VERSION = '0.18.1';</script>
<script>
(function () {
  var r = document.documentElement;
  var pal = 'a', font = 'assistant';
  try {
    pal = localStorage.getItem('fv.palette') || pal;
    font = localStorage.getItem('fv.typeface') || font;
  } catch (e) { /* גלישה פרטית */ }
  r.setAttribute('data-pal', pal);
  r.setAttribute('data-font', font);
})();
</script>
